<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ação SARESP · Matemática 7º ano · 3º bimestre</title>
<style>
:root{color-scheme:dark;--bg:#081326;--card:#11223a;--line:#304662;--txt:#f4f7ff;--muted:#b9cbe0;--teal:#61ead5;--green:#a5f28c;--yellow:#ffd27e;--red:#ff9a9e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 84% 0,#162e45 0,transparent 48%),var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
.app{min-height:100dvh;max-width:1540px;margin:auto;padding:clamp(.75rem,2.9vh,2.1rem) clamp(.9rem,4.7vw,5rem);display:grid;grid-template-rows:auto 1fr auto;gap:clamp(.65rem,2vh,1.45rem)}
.brand{font-size:clamp(.72rem,1.35vw,.93rem);letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--teal)}
.bar,.controls,.clockline,.slidehead{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}.bar,.slidehead{justify-content:space-between}
button,select{background:var(--card);color:inherit;border:1px solid var(--line);border-radius:.6rem;padding:.48rem .72rem;font:inherit}
button{cursor:pointer}button:hover:not(:disabled),select:hover{border-color:var(--teal)}button:disabled{opacity:.45;cursor:default}:is(button,select,summary,a):focus-visible{outline:3px solid var(--teal);outline-offset:3px}a{color:var(--teal)}
main{--accent:var(--teal);display:grid;align-content:start;gap:clamp(.58rem,1.5vh,1.18rem)}
h1,h2,p,figure{margin:0}h1{font-size:clamp(1.8rem,min(5.2vw,7.3vh),4.6rem);letter-spacing:-.037em;line-height:1.06}h2{font-size:clamp(1.1rem,2.1vw,1.65rem);line-height:1.15}
p{max-width:72ch}b,strong{color:var(--accent)}.meta{color:var(--muted);font-size:.87rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.lead,.concept,.prompt{font-size:clamp(1.09rem,min(2.5vw,3.9vh),2rem)}
.cols{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);align-items:start;gap:clamp(.7rem,2.6vw,2.3rem)}
.stack{display:grid;gap:.65em}.panel{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:clamp(.75rem,1.65vw,1.4rem)}
.example{border-left:4px solid var(--teal);font-size:clamp(1rem,min(1.9vw,3.05vh),1.53rem)}.example h2{margin-bottom:.44rem}
.level{display:flex;align-items:center;gap:.55rem;font-weight:800;color:var(--accent)}
.light{display:grid;gap:3px;border:1px solid var(--line);background:#050b15;border-radius:.44rem;padding:4px}.light i{width:.6rem;height:.6rem;border-radius:50%;background:#354560}.light i.on{background:var(--accent)}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.48rem;padding:0;margin:0;list-style:none}
.options li{background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:.4em .55em;display:flex;align-items:baseline;gap:.58em;font-size:clamp(1.04rem,min(2.1vw,3.3vh),1.65rem)}
.options .letter{color:var(--accent);min-width:1.27em;font-weight:850}.options .right{border-color:var(--green);background:#19372f}
.answer{background:#142f2a;border:1px solid #42836c;border-radius:.62rem;padding:.58em .76em;font-size:clamp(.96rem,min(1.9vw,2.8vh),1.45rem)}.answer p+p{margin-top:.32rem}.answer b{color:var(--green)}.tip{color:var(--muted);font-size:clamp(.86rem,1.5vw,1.03rem)}
.toolrow{border-top:1px solid var(--line);padding-top:.52rem;display:grid;gap:.35rem}.clockline{color:var(--muted);font-size:.88rem}.clock{color:var(--teal);font-size:1.25rem;font-weight:900;font-variant-numeric:tabular-nums}.clock.done{color:var(--yellow)}
progress{width:100%;height:5px;accent-color:var(--teal)}.next{color:#071f1d;background:var(--teal);border-color:var(--teal);font-weight:820}.back{margin-left:auto}select{max-width:min(15rem,67vw)}
.schedule{margin:0;padding:0;list-style:none;display:grid;gap:.35rem}.schedule li{display:flex;gap:.65rem;justify-content:space-between;border-bottom:1px solid var(--line);padding:.32rem 0}.schedule li:last-child{border:0}
.diagram svg{width:100%;max-height:24vh;display:block}.diagram text{font:700 16px system-ui,sans-serif;fill:var(--txt);text-anchor:middle}.diagram figcaption{color:var(--muted);font-size:.89rem;margin-top:.4rem}
.mathcard{display:flex;align-items:center;justify-content:center;gap:.43rem;flex-wrap:wrap;font-size:clamp(1.1rem,2.8vw,2.3rem);color:var(--teal);font-weight:800;min-height:6.6rem}
.token{display:inline-block;border:1px solid var(--line);border-radius:.5rem;background:#192f49;padding:.2em .43em}
table{border-collapse:collapse;width:100%;font-size:clamp(.95rem,1.55vw,1.25rem)}th,td{padding:.4em .55em;border-bottom:1px solid var(--line);text-align:center}th{color:var(--teal)}caption{color:var(--muted);margin-bottom:.3rem}
details{font-size:.94rem;color:var(--muted)}summary{cursor:pointer;color:var(--teal);font-weight:750}details p{margin-top:.45em}
.pair{margin:0;padding-left:1.2em}.pair li+li{margin-top:.38em}.cover h1{font-size:clamp(2.6rem,min(8vw,10.5vh),7rem);color:var(--teal)}
@media(max-width:720px){.cols,.options{grid-template-columns:1fr}.back{margin-left:0}.controls{gap:.38rem}button,select{padding:.39rem .56rem}.diagram svg{max-height:22vh}}

:root{
  --bg:#0a071b;--card:#151130;--line:#443c71;--txt:#fbf9ff;--muted:#c9c1e3;
  --teal:#4ef9ff;--green:#c8ff5e;--yellow:#ffe76b;--red:#ff69e0
}
body{background:radial-gradient(ellipse at 90% 0,#311046 0,transparent 52%),radial-gradient(ellipse at 0 80%,#132650 0,transparent 45%),var(--bg)}
.bar{border-bottom:1px solid #493771;padding-bottom:.62rem}
h1{color:var(--txt);text-shadow:0 0 1.1rem #ae73ff40}
.cover h1{text-shadow:0 0 1.5rem #4ef9ff50}
.light i{background:#514577}.light i.on{box-shadow:0 0 .75rem var(--accent)}
.neon-diagram{background:radial-gradient(ellipse at 85% 4%,#351949 0,transparent 65%),#0d0b28;border-color:#695a9b;margin:0;min-width:0}
.neon-diagram svg{max-height:29vh}
.neon-diagram svg text{font-weight:750}
.neon-diagram figcaption{margin-top:.38rem}
.options li{border-left:3px solid var(--accent)}
.options .right{border-color:var(--green);background:#26392b}
.neon-table tr:nth-child(even){background:#302047}
.neon-table .diagram{margin-top:.6rem}
.neon-table .diagram svg{max-height:12vh}
.neon-table th:nth-child(2){color:var(--red)}
.neon-table td:nth-child(2){color:#ffb7ef;font-weight:750}
.cover-art{display:block;width:100%;height:clamp(8rem,24vh,17rem);object-fit:contain;background:#060419;border:1px solid #695a9b;border-radius:.85rem}
.exit-item{display:grid;gap:.6rem}
@media(max-width:720px){
  .question .cols{gap:.8rem}
  .question .question-copy{display:contents}
  .question .question-copy .prompt{grid-row:1}
  .question .cols>.neon-diagram{grid-row:2}
  .question .question-copy .options,.question .question-copy .tip{grid-row:3}
  .neon-diagram svg{max-height:32vh}
}

.slide-surface{position:relative;min-width:0;display:grid}
.ink-layer{position:absolute;inset:0;z-index:1;width:100%;height:100%;overflow:hidden;pointer-events:none}
.ink-layer.is-drawing{pointer-events:auto;cursor:crosshair;touch-action:none;user-select:none}
.ink-layer path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#pen[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#071f1d;font-weight:800}
.pen-tools{display:flex;flex-wrap:wrap;gap:.38rem;align-items:center}
.pen-width{display:inline-flex;align-items:center;gap:.35rem;font-size:.88rem;color:var(--muted)}
.pen-width select{color:var(--txt)}

#open-board{color:var(--teal);border-color:var(--teal);font-weight:800}
.board-dialog{
  box-sizing:border-box;width:min(96vw,1440px);height:94vh;height:94dvh;
  max-width:none;max-height:none;padding:clamp(.65rem,2vw,1.35rem);
  color:var(--txt);background:#12102a;border:1px solid #7463aa;border-radius:1rem
}
.board-dialog[open]{display:grid;grid-template-rows:auto minmax(0,1fr);gap:.75rem}
.board-dialog::backdrop{background:#050314dc}
.board-header{display:flex;justify-content:space-between;align-items:center;gap:.55rem 1rem;flex-wrap:wrap}
.board-heading{display:grid;gap:.15rem}
.board-heading h2{color:var(--teal)}
#board-topic{color:var(--muted);font-size:.95rem}
.board-surface{
  position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid #4a426f;border-radius:.6rem;
  background-color:#0b0920;
  background-image:linear-gradient(to right,#39315c70 1px,transparent 1px),linear-gradient(to bottom,#39315c70 1px,transparent 1px);
  background-size:28px 28px
}
#close-board{background:var(--teal);border-color:var(--teal);color:#071f1d;font-weight:800}
</style>
</head>
<body>
<div class="app">
<header class="bar">
  <span class="brand">Ação SARESP · Matemática · 7º ano</span>
  <div class="controls">
    <button id="open-board" type="button" aria-haspopup="dialog" aria-controls="board-dialog" hidden>Abrir lousa</button>
    <button id="pen" type="button" aria-pressed="false" aria-controls="pen-tools">Caneta</button>
    <div class="pen-tools" id="pen-tools" hidden>
      <select id="ink-color" aria-label="Cor da caneta">
        <option value="#4ef9ff">Ciano</option>
        <option value="#ff69e0">Rosa</option>
        <option value="#c8ff5e">Verde-limão</option>
        <option value="#ffe76b">Amarelo</option>
        <option value="#fbf9ff">Branco</option>
      </select>
      <label class="pen-width">
        Espessura
        <select id="ink-width">
          <option value="2">2 px</option>
          <option value="4" selected>4 px</option>
          <option value="6">6 px</option>
          <option value="9">9 px</option>
          <option value="12">12 px</option>
        </select>
      </label>
      <button id="undo-ink" type="button">Desfazer</button>
      <button id="clear-ink" type="button">Limpar slide</button>
    </div>
    <button id="full" type="button">Tela cheia</button>
  </div>
</header>
<div class="slide-surface">
  <main id="stage" aria-label="Slide atual"></main>
  <svg id="ink" class="ink-layer" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="transparent"/><g id="ink-strokes"></g></svg>
</div>
<footer class="toolrow">
<div class="clockline"><span class="clock" id="clock" role="timer" aria-label="Tempo restante"></span><span id="pace"></span><span id="timeup" role="status" hidden>Tempo do slide encerrado.</span></div>
<progress id="progress" aria-label="Tempo restante neste slide"></progress>
<div class="controls">
<button id="toggle" type="button">Iniciar tempo</button><button id="reset" type="button">Reiniciar tempo</button>
<button id="reveal" type="button" aria-pressed="false">Mostrar correção</button>
<button class="back" id="prev" type="button">← Voltar</button><select id="jump" aria-label="Ir para um slide"></select><button class="next" id="next" type="button">Avançar →</button>
</div>
</footer>
</div>

<dialog class="board-dialog" id="board-dialog" aria-labelledby="board-title" aria-describedby="board-topic">
  <div class="board-header">
    <div class="board-heading">
      <h2 id="board-title">Lousa</h2>
      <p id="board-topic"></p>
    </div>
    <div class="pen-tools">
      <span class="clock" id="board-clock" role="timer" aria-label="Tempo restante do slide"></span>
      <select id="board-color" aria-label="Cor da caneta na lousa">
        <option value="#4ef9ff">Ciano</option>
        <option value="#ff69e0">Rosa</option>
        <option value="#c8ff5e">Verde-limão</option>
        <option value="#ffe76b">Amarelo</option>
        <option value="#fbf9ff">Branco</option>
      </select>
      <label class="pen-width">
        Espessura
        <select id="board-width">
          <option value="2">2 px</option>
          <option value="4" selected>4 px</option>
          <option value="6">6 px</option>
          <option value="9">9 px</option>
          <option value="12">12 px</option>
        </select>
      </label>
      <button id="board-undo" type="button">Desfazer</button>
      <button id="board-clear" type="button">Limpar lousa</button>
      <button id="close-board" type="button" autofocus>Voltar ao slide</button>
    </div>
  </div>
  <div class="board-surface">
    <svg id="board-ink" class="ink-layer is-drawing" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="transparent"/><g id="board-strokes"></g></svg>
  </div>
</dialog>
<script>
const rounds = [
  {
    "title": "Expressões e áreas",
    "ref": "Aulas 1 a 5 do caderno",
    "concept": [
      "Uma expressão algébrica usa letras para representar números. Para calcular seu valor, substitua as letras pelos valores dados.",

      ],
      [
        "Mural de duas peças",
        "Um mural é formado por um retângulo de base 10 m e altura h e por um triângulo de base 10 m e altura h ÷ 2. As peças foram unidas sem se sobrepor. Qual é a área total do mural quando h = 4 m?",
        [
          "40 m²",
          "45 m²",
          "60 m²",
          "50 m²"
        ],
        3,
        "O retângulo tem área 10 × 4 = 40 m². A altura do triângulo é 2 m, então sua área é (10 × 2) ÷ 2 = 10 m². Total: <b>50 m²</b>.",

        "mural"

    "wrap": [

    ],
    "example": "Em 6, 10, 14, 18, somamos 4 a cada passo. O termo de posição n é 6 + 4(n − 1), ou <b>4n + 2</b>.",
    "visual": "seq",
    "q": [
      [
        "Fileiras de cadeiras",
        "Uma equipe monta fileiras seguindo o mesmo padrão: 11, 16, 21, 26, … Qual é o próximo termo?",
        [
          "27",
          "30",
          "31",
          "36"
        ],
        2,
        "As diferenças são todas de 5. Então 26 + 5 = <b>31</b>.",

      ],
      [

        "A tabela mostra quantas peças uma equipe usou em cada etapa. A quantidade aumenta sempre da mesma forma. Qual expressão fornece o total de peças na etapa n?",

          "7n",

    ],
    "wrap": [
      "Na sequência 7, 11, 15, 19, qual é a regra de um termo para o próximo?",

    "wrapAnswer": "Some 4 ao termo anterior. Na posição 3, a regra dá 4 × 3 + 3 = 15, o mesmo valor mostrado na sequência."

  {

    "concept": [

function sequence(values,positions,caption,changes=[]){
  const step=310/values.length;
  const width=Math.min(66,step-17);
  const art=values.map((value,i)=>{

    const link=i===values.length-1?'':'<g transform="translate('+(x+step*.5-8)+' 82) scale(.6)" style="color:'+violet+'">'+arrow+'</g>';
    return label(x,42,positions[i],violet,14)+box(x-width/2,60,width,46,color)+label(x,90,value,color,21)+link+
      (changes[i]?label(x+step*.5,131,changes[i],lime,13):'');
  }).join('');
  const desc=values.map((value,i)=>positions[i]+': '+(value==='?'?'valor desconhecido':value)).join('; ');
  const alt=desc+(changes.length?'. Entre os quadros: '+changes.filter(Boolean).join(', '):'');

function stop(){
  clearInterval(interval);interval=null;
  el('toggle').disabled=!remaining;
  el('toggle').textContent=remaining&&remaining<slides[index].time*60000?'Continuar tempo':'Iniciar tempo';
}
function clock(){
  const s=Math.ceil(remaining/1000);
  el('clock').textContent=format(s);
  el('board-clock').textContent=el('clock').textContent;
  el('clock').classList.toggle('done',s===0);
  el('timeup').hidden=s!==0;
  el('progress').value=remaining/1000;
}
function reset(){
  remaining=slides[index].time*60000;
  stop();clock();
}
function tick(){remaining=Math.max(0,deadline-performance.now());clock();if(!remaining)stop();}
function toggle(){
  if(interval!==null){tick();stop();return;}
  if(!remaining)return;
  deadline=performance.now()+remaining;
  el('toggle').textContent='Pausar tempo';
  interval=setInterval(tick,100);
}
function reveal(){
  const answer=el('answer');
  if(!answer)return;
  revealed=!revealed;
  answer.hidden=!revealed;
  el('reveal').textContent=revealed?'Ocultar correção':'Mostrar correção';
  el('reveal').setAttribute('aria-pressed',String(revealed));
  const options=el('options');
  if(options)options.children[slides[index].q[3]].classList.toggle('right',revealed);
}


const inkNamespace='http://www.w3.org/2000/svg';
// Keep x proportional to the writing surface, and y in CSS pixels so a slide
// growing when the correction opens does not stretch the annotations.
const inkWidth=1000;
function setupInk({ink,strokes,color,thickness,undo,clear}){
  const inkBySlide=new Map();
  let inkPage;
  let drawing=ink.classList.contains('is-drawing');
  let activeStroke=null;

  function syncInkViewport(){
    const {height}=ink.getBoundingClientRect();
    if(height>0)ink.setAttribute('viewBox','0 0 '+inkWidth+' '+height);
  }

  function updateInkButtons(){
    const hasInk=!!inkPage.group.lastElementChild;
    undo.disabled=!hasInk&&!inkPage.cleared.length;
    clear.disabled=!hasInk;
  }

  function endStroke(){
    if(!activeStroke)return;
    const {id}=activeStroke;
    activeStroke=null;
    if(ink.hasPointerCapture(id))ink.releasePointerCapture(id);
  }

  function show(slide){
    endStroke();
    if(!inkBySlide.has(slide)){
      inkBySlide.set(slide,{group:document.createElementNS(inkNamespace,'g'),cleared:[]});
    }
    inkPage=inkBySlide.get(slide);
    strokes.replaceChildren(inkPage.group);
    syncInkViewport();
    updateInkButtons();
  }

  function setDrawing(enabled){
    endStroke();
    drawing=enabled;
    ink.classList.toggle('is-drawing',enabled);
  }

  function inkPoint(event,bounds){
    const x=(event.clientX-bounds.left)*inkWidth/bounds.width;
    const y=event.clientY-bounds.top;
    return [x.toFixed(2),y.toFixed(2)];
  }

  ink.addEventListener('pointerdown',event=>{
    if(!drawing||!inkPage||activeStroke||!event.isPrimary||event.button!==0)return;
    const bounds=ink.getBoundingClientRect();
    if(!bounds.width||!bounds.height)return;
    event.preventDefault();
    syncInkViewport();
    ink.setPointerCapture(event.pointerId);
    const point=inkPoint(event,bounds);
    const path=document.createElementNS(inkNamespace,'path');
    path.setAttribute('stroke',color.value);
    path.setAttribute('stroke-width',thickness.value);
    const data='M '+point.join(' ')+' l .01 0';
    path.setAttribute('d',data);
    inkPage.group.append(path);
    activeStroke={id:event.pointerId,path,data,last:point.join(' ')};
    updateInkButtons();
  });

  function extendStroke(event){
    if(activeStroke?.id!==event.pointerId)return;
    const bounds=ink.getBoundingClientRect();
    if(!bounds.width)return;
    const samples=event.getCoalescedEvents?.()??[];
    for(const sample of samples.length?samples:[event]){
      const point=inkPoint(sample,bounds).join(' ');
      if(activeStroke.last===point)continue;
      activeStroke.data+=' L '+point;
      activeStroke.last=point;
    }
    activeStroke.path.setAttribute('d',activeStroke.data);
  }
  ink.addEventListener('pointermove',extendStroke);
  ink.addEventListener('pointerup',event=>{
    if(activeStroke?.id!==event.pointerId)return;
    extendStroke(event);
    endStroke();
  });
  for(const type of ['pointercancel','lostpointercapture']){
    ink.addEventListener(type,event=>{
      if(activeStroke?.id===event.pointerId)endStroke();
    });
  }
  undo.onclick=()=>{
    endStroke();
    const group=inkPage.group;
    if(group.lastElementChild){
      group.lastElementChild.remove();
    }else if(inkPage.cleared.length){
      for(const stroke of inkPage.cleared.pop())group.append(stroke);
    }
    updateInkButtons();
  };
  clear.onclick=()=>{
    endStroke();
    const group=inkPage.group;
    if(group.childElementCount){
      inkPage.cleared.push(Array.from(group.children));
      group.replaceChildren();
    }
    updateInkButtons();
  };
  if(typeof ResizeObserver==='function')new ResizeObserver(syncInkViewport).observe(ink);
  else window.addEventListener('resize',syncInkViewport);
  return {show,setDrawing,endStroke};
}
const slideWidth=el('ink-width'), boardWidth=el('board-width');
slideWidth.onchange=()=>{boardWidth.value=slideWidth.value;};
boardWidth.onchange=()=>{slideWidth.value=boardWidth.value;};

const slideInk=setupInk({
  ink:el('ink'),strokes:el('ink-strokes'),color:el('ink-color'),
  thickness:slideWidth,undo:el('undo-ink'),clear:el('clear-ink')
});
el('pen').onclick=()=>{
  const enabled=el('pen').getAttribute('aria-pressed')!=='true';
  el('pen').setAttribute('aria-pressed',String(enabled));
  el('pen-tools').hidden=!enabled;
  slideInk.setDrawing(enabled);
};

const board=el('board-dialog');
const boardInk=setupInk({
  ink:el('board-ink'),strokes:el('board-strokes'),color:el('board-color'),
  thickness:boardWidth,undo:el('board-undo'),clear:el('board-clear')
});
function hasBoard(slide){
  return slide.kind!=='cover';
}
el('open-board').onclick=()=>{
  const slide=slides[index];
  if(board.open||!hasBoard(slide))return;
  const prefix={question:'Questão '+slide.number,concept:'Exemplo',wrap:'Rodada '+(slide.r+1)}[slide.kind];
  el('board-topic').textContent=prefix?prefix+' · '+slide.title:slide.title;
  board.showModal();
  boardInk.show(index);
};
el('close-board').onclick=()=>board.close();
board.addEventListener('close',()=>boardInk.endStroke());

function show(i){
  if(i<0||i>=slides.length)return;
  index=i;revealed=false;
  const s=slides[i], stage=el('stage');
  const section=s.r===undefined?(s.kind==='cover'?'3º bimestre':'Fechamento'):'Rodada '+(s.r+1)+' · '+(s.number?'Questão '+String(s.number).padStart(2,'0'):s.kind==='concept'?'Conceito':'Conferência');
  const light=s.level?'<div class="level">'+s.level.label+'<span class="light" aria-hidden="true">'+[0,1,2].map(n=>'<i class="'+(n===s.level.lit?'on':'')+'"></i>').join('')+'</span></div>':'';
  stage.style.setProperty('--accent',s.level?.color??'var(--teal)');
  stage.classList.toggle('cover',s.kind==='cover');
  stage.classList.toggle('question',s.kind==='question');
  stage.innerHTML='<div class="slidehead"><p class="meta">'+section+' · '+(i+1)+' / '+slides.length+'</p>'+light+'</div><h1>'+s.title+'</h1>'+content(s);
  slideInk.show(i);
  el('open-board').hidden=!hasBoard(s);
  el('reveal').hidden=!['question','wrap','end'].includes(s.kind);
  el('reveal').textContent='Mostrar correção';
  el('reveal').setAttribute('aria-pressed','false');
  el('prev').disabled=i===0;el('next').disabled=i===slides.length-1;
  el('next').textContent=i===0?'Começar →':'Avançar →';
  el('jump').value=String(i);
  el('pace').textContent='Min '+s.start+'–'+(s.start+s.time)+' de '+scheduled+' · '+s.time+' min neste slide';
  el('progress').max=s.time*60;reset();
}
el('prev').onclick=()=>show(index-1);
el('next').onclick=()=>show(index+1);
el('jump').innerHTML=slides.map((s,i)=>'<option value="'+i+'">'+(i+1)+'. '+(s.kind==='wrap'?'Conferência '+(s.r+1):s.title)+'</option>').join('');
el('jump').onchange=()=>show(Number(el('jump').value));
el('toggle').onclick=toggle;el('reset').onclick=reset;el('reveal').onclick=reveal;
el('full').hidden=!document.fullscreenEnabled;
el('full').onclick=async()=>{
  try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
  catch{el('full').textContent='Tela cheia indisponível';}
};
document.addEventListener('fullscreenchange',()=>{el('full').textContent=document.fullscreenElement?'Sair da tela cheia':'Tela cheia';});
document.addEventListener('keydown',e=>{
  if(board.open||e.defaultPrevented||e.ctrlKey||e.altKey||e.metaKey||e.target.closest('select, input, textarea'))return;
  if(e.key==='ArrowLeft')show(index-1);
  if(e.key==='ArrowRight')show(index+1);
});
show(0);
</script>
